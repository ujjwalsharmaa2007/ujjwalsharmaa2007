name: Generate Stats Cards

on:
  schedule:
    - cron: "0 0 * * *"   # regenerates once a day automatically
  workflow_dispatch:        # lets you trigger it manually anytime

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@main
        with:
          card: stats
          options: "username=ujjwalsharmaa2007&show_icons=true&theme=tokyonight&hide_rank=true&count_private=true"
          path: "profile/stats.svg"

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@main
        with:
          card: top-langs
          options: "username=ujjwalsharmaa2007&layout=compact&theme=tokyonight&hide=html,css"
          path: "profile/top-langs.svg"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/
          git diff --staged --quiet || git commit -m "chore: update stats cards"
          git push
